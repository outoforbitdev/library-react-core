name: Release
on:
  push:
    branches: ["main"]

# Declare default permissions as read only.
permissions: read-all

jobs:
  detect:
    permissions:
      contents: write
    # yamllint disable-line rule:line-length
    uses: outoforbitdev/reusable-workflows-library/.github/workflows/detect-new-changelog-version.yml@03971727e99eab8bdaebb84c9e2e63f3d2429eab # v1.1.0

  pack:
    needs: detect
    if: needs.detect.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    name: Pack npm Package
    permissions:
      contents: read
    steps:
      - name: Checkout
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup node
        # yamllint disable-line rule:line-length
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20.x"
      - run: npm ci --include=dev
      - run: npm run build
      - run: npm pack
      - name: Upload package artifact
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: "*.tgz"

  publish:
    needs: [detect, pack]
    if: needs.detect.outputs.should-release == 'true'
    permissions:
      contents: write
    # yamllint disable-line rule:line-length
    uses: outoforbitdev/reusable-workflows-library/.github/workflows/publish-release.yml@03971727e99eab8bdaebb84c9e2e63f3d2429eab # v1.1.0
    with:
      version: ${{ needs.detect.outputs.new-version }}
      draft: false
      prerelease: ${{ needs.detect.outputs.is-prerelease == 'true' }}
      release-notes: ${{ needs.detect.outputs.release-notes }}
      artifact-name: npm-package

  npm-publish:
    needs: [detect, publish]
    if: needs.detect.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    name: Publish to npm
    permissions:
      id-token: write
    steps:
      - name: Download package artifact
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
      - name: Setup node
        # yamllint disable-line rule:line-length
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20.x"
          registry-url: "https://registry.npmjs.org"
      - run: npm publish ./*.tgz --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
